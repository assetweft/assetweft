name: C1

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c1:
    name: c1-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Toolchain (pinned by rust-toolchain.toml)
        run: |
          set -eu
          rustup --version
          rustup show
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: C1 (architecture, comments and Rust checks)
        run: |
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            export ASSETWEFT_HEX_BASE=HEAD^1
          fi
          ./tools/c1-stdout-contract.sh

      - name: Default SQLite busy wait on the budget writer
        run: python3 tools/default-busy-wait.py
