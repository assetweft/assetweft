# 职责(responsibility): AW-003:A 合同 fixture gate 的 GitHub Actions 定义。
# 依赖(dependencies): 仓库内 package.json / package-lock.json；actions 固定到经官方 GitHub API 核验的 commit SHA
#   （核验记录 work/aw003-contracts/ci-action-verification.json，2026-11-12 UTC）；npm ci 安装 Ajv 8.17.1 开发依赖。
# 调用方(callers): GitHub Actions push / pull_request / workflow_dispatch。
# 不变量(invariants): 不加 workflow 级 paths 过滤（必过检查不得被 paths 跳过）；最小 permissions: contents: read；
#   显式 timeout-minutes；不使用浮动 tag；只运行本地 node 校验，不下载权重、不启动模型/GPU、不调用付费 API、
#   不上传私有素材、不使用 GPU runner；stdout 为机器结果、stderr 为日志；失败即非零退出，不吞异常。

name: contracts

"on":
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-fixture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout 4.2.2, pinned SHA from AW002 official verification, re-confirmed via API 2026-11-12
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4 lightweight tag -> commit, resolved via API 2026-11-12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci
      - name: AW-CONTRACT-001 fixture gate
        run: node tools/contract_check.mjs --manifest contracts/fixtures/manifest.json --fixtures contracts/fixtures/fixtures.json --schema contracts/first-delivery-contract.schema.json

      - name: Reject invalid fixture manifests
        run: npm test
