name: CI Model Runner & Hardware Feasibility Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Model Runner Feasibility & Hardware Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Benchmark Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run CI Model Runner Benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci_model_benchmark.py

      - name: Upload Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-benchmark-report
          path: model_benchmark_report.json
          retention-days: 7
