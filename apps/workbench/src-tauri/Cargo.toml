[package]
name = "assetweft-workbench"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"

[workspace]

[dependencies]
assetweft-core = { path = "../../../crates/assetweft-core" }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.9.3", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = "=2.5.2"

[dev-dependencies]
tempfile = "=3.27.0"
