# Responsibility: bounded M6 machine CLI; consumes core, never executes generation.
[package]
name = "assetweft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "assetweft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
assetweft-core = { path = "../assetweft-core" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = "=1.0.229"
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
