# 职责: 共享核心的合同词表、独立文件验证与 SQLite 文件持久化原型。
# 依赖: std、gltf 1.4.1、sha2 0.11.1、rusqlite 0.42.0 bundled；版本由锁文件固定。
# 调用方: 将来的 CLI/桌面/验证入口；当前由本 crate 单元测试、集成测试与 C1 调用。
# 不变量: 未知合同词表值必须报错不默认；NOT_RUN 不是 PASS；来源只记录声明不验证；
#          GLB 范围只接受二进制容器，plain JSON 不得被标为 GLB；读取上限配置不得 panic。

[package]
name = "assetweft-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# AW-013:A 只把已锁的成熟 wire 解析提升为直接依赖（版本与 Cargo.lock 既有 pin 一致，不新增 crate 版本）。
# serde/serde_json 仅做 JSON→Rust 类型解析；验证逻辑唯一在 generation_spec.rs，不写第二套 JSON Schema 引擎。
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# 成熟标准解析器：glTF 2.0/GLB 官方 Rust 实现；不使用 import（图片/URI）能力，仅做容器与结构解析。
gltf = { version = "1.4.1", default-features = false }
# 成熟哈希库，不自造 SHA-256。
sha2 = "0.11.1"

# AW-004:A fixed bundled SQLite build; preserve the reviewed validation dependencies.
rusqlite = { version = "=0.42.0", features = ["bundled"] }

[dev-dependencies]
