  - id: "E02"
    domain: "Tauri v2 进程模型、Sidecar、自定义协议与签名更新"
    authority_owner: "Tauri Programme (The Commons Conservancy)"
    official_urls:
      - "https://v2.tauri.app/concept/process-model/"
      - "https://v2.tauri.app/develop/sidecar/"
      - "https://v2.tauri.app/plugin/updater/"
    verified_date: "2026-11-11"
    status: "CONFIRMED_WITH_PROTOTYPE_GATE"
    constraint: >
      Sidecar 仅管理单可执行文件启动；PostgreSQL 18 包含动态库、share/locale 资源及父子进程树，
      在 Windows 更新替换时存在文件锁与残留进程风险，须通过独立 DatabaseSupervisor 与 AW-004 原型验证。
      3D 大资产传输须走 register_asynchronous_uri_scheme_protocol (assetweft://) 或 Raw Binary IPC，禁走 JSON 序列化。

  - id: "E03"
    domain: "PostgreSQL 18 集群初始化、启停控制与跨版本升级"
    authority_owner: "PostgreSQL Global Development Group"
    official_urls:
      - "https://www.postgresql.org/docs/18/app-initdb.html"
      - "https://www.postgresql.org/docs/18/app-pg-ctl.html"
      - "https://www.postgresql.org/docs/18/pgupgrade.html"
    verified_date: "2026-11-11"
    status: "CONFIRMED_WITH_PROTOTYPE_GATE"
    constraint: >
      PostgreSQL 18 的 initdb 默认启用 --data-checksums；强制指定 --encoding=UTF8 --locale=C --no-locale
      以规避 Windows 中文用户名与 locale 兼容故障；禁用 trust，采用本地 Unix Socket (macOS) 或 127.0.0.1 动态端口 +
      每次启动随机生成的临时密码文件 + scram-sha-256 认证。

