    constraint: >
      Autodesk FBX SDK 为闭源专有许可，严禁静态链接或打包进 AssetWeft 开源主仓库发行包。
      Unreal 交付采取双轨架构：(1) 开源默认路径采用 UE 5.6+ 原生 Interchange Framework (glTF 2.0) +
      Unreal C++ Editor 插件消费 ExportManifest；(2) 如需 FBX 2020.2，仅通过外部隔离进程（用户本地 Blender CLI
      或独立插件进程）转换，与主程序许可证完全解耦。

